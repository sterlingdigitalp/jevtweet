name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check jevtweet tests scripts
      - run: uv run ruff format --check jevtweet tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_public.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: uv run jevtweet --data-dir /tmp/jevtweet-demo demo > /tmp/jevtweet-demo-result.json
